<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar Publicação · Minha Medi Sina ♡</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body onload="validarSessao(); carregarPagina()">
  <div class="painel">
    <aside class="menu-lateral">
      <a class="logo" href="index.html">Minha Medi Sina<small>Para Giovana ♡</small></a>
      <a class="menu-item" href="dashboard.html">Visão geral & Métricas</a>
      <a class="menu-item" href="minhas-lembrancas.html">Meus Posts</a>
      <a class="menu-item ativo" href="nova-lembranca.html">Criar publicação</a>
      <a class="menu-item" href="perfil.html">Meu perfil</a>
      <a class="menu-item menu-item-sair" href="index.html" onclick="sair()">Sair</a>
    </aside>
    <main class="painel-conteudo">
      <div class="painel-topo">
        <div>
          <h6 class="texto-suave">Publique um novo post para a Giovana</h6>
        </div>
        <div><span id="span_nome_usuario"></span> <span class="avatar" id="span_avatar"></span></div>
      </div>
      <div class="titulo-pagina">
        <div>
          <h1 id="h1_titulo">Criar Novo Post</h1>
          <p>Guarde uma fotografia, declaração ou momento que merece ficar para sempre.</p>
        </div>
      </div>
      <div class="caixa">
        <div class="campo">
          <label for="input_titulo">Título do Post</label>
          <input id="input_titulo" type="text" maxlength="120" placeholder="Dê um título especial a esse momento">
        </div>
        <div class="campo">
          <label for="input_descricao">Mensagem / Descrição</label>
          <textarea id="input_descricao" placeholder="Escreva aqui a história desse dia ou uma mensagem carinhosa para a Giovana..."></textarea>
        </div>
        <div class="duas-colunas">
          <div class="campo">
            <label for="input_data">Data do Momento</label>
            <input id="input_data" type="date">
          </div>
          <div class="campo">
            <label for="select_categoria">Categoria</label>
            <select id="select_categoria">
              <option value="Fotografias">Fotografias</option>
              <option value="Mensagens">Mensagens</option>
              <option value="Datas especiais">Datas especiais</option>
              <option value="Momentos engraçados">Momentos engraçados</option>
            </select>
          </div>
        </div>
        <div class="campo">
          <label>Fotografia do Post (opcional)</label>
          <div class="area-upload">
            <p>Escolha uma foto especial do computador ou telefone</p>
            <button class="botao margem-vertical-12" id="botao_foto" onclick="escolherFoto()">Adicionar fotografia</button>
            <input type="file" id="input_foto" accept="image/jpeg,image/png,image/webp" onchange="fotoEscolhida()" hidden>
            <div class="previa-upload" id="div_previa" hidden></div>
          </div>
        </div>
        <p id="p_mensagem" class="mensagem-formulario"></p>
        <div class="linha-botoes">
          <button class="botao botao-principal" id="botao_salvar" onclick="salvarPost()">+ Publicar Post</button>
        </div>
      </div>
    </main>
  </div>
    <script src="js/geral.js"></script>
    <script src="js/nova-lembranca.js"></script>
</body>
</html>
