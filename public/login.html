<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Minha Medi Sina ♡</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="autenticacao">
    <div class="autenticacao-imagem">
      <div class="autenticacao-fotos">
        <figure class="mini-polaroid mini-polaroid-1">
          <div class="foto-ilustrativa foto-ilustrativa-5">
            <img src="fotos/20260823_160834.jpg" alt="Vendo flores">
          </div>
          <figcaption>cada momento</figcaption>
        </figure>
        <figure class="mini-polaroid mini-polaroid-2">
          <div class="foto-ilustrativa foto-ilustrativa-4">
            <img src="fotos/20260823_173056.jpg" alt="Minha mulher">
          </div>
          <figcaption>guardado aqui ♡</figcaption>
        </figure>
      </div>
      <div class="autenticacao-citacao">
        <h2>“Algumas histórias merecem um lugar só delas.”</h2>
        <p>E esta é a nossa maneira de guardar cada pedacinho de carinho para a Giovana ♡</p>
      </div>
    </div>
    <div class="autenticacao-formulario">
      <div class="autenticacao-topo">
        <a class="logo" href="index.html">Minha Medi Sina<small>Para Giovana · Nosso cantinho</small></a>
      </div>
      <div class="formulario-login">
        <nav class="autenticacao-abas">
          <a class="ativo" href="login.html">Entrar</a>
          <a href="cadastro.html">Criar conta</a>
        </nav>
        <div class="formulario-cabecalho">
          <h1>Que bom ter você aqui!</h1>
          <p class="subtitulo">Entre para curtir, comentar e publicar no nosso mural.</p>
        </div>
        <div class="campo">
          <label for="input_email">E-mail</label>
          <input id="input_email" type="email" placeholder="giovana@amor.com">
        </div>
        <div class="campo">
          <label for="input_senha">Senha</label>
          <input id="input_senha" type="password" placeholder="Digite sua senha">
        </div>
        <br>
        <button class="botao botao-principal botao-largo" onclick="entrar()">Entrar</button>
        <p id="p_mensagem" class="mensagem-formulario"></p>
      </div>
    </div>
  </main>
    <script src="js/geral.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
