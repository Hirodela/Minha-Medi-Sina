<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu perfil · Minha Medi Sina ♡</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body onload="mostrarPerfil()">
  <div class="painel">
    <aside class="menu-lateral">
      <a class="logo" href="index.html">Minha Medi Sina<small>Para Giovana ♡</small></a>
      <a class="menu-item" href="dashboard.html">Visão geral & Métricas</a>
      <a class="menu-item" href="minhas-lembrancas.html">Meus Posts</a>
      <a class="menu-item" href="nova-lembranca.html">Criar publicação</a>
      <a class="menu-item ativo" href="perfil.html">Meu perfil</a>
      <a class="menu-item menu-item-sair" href="index.html" onclick="sair()">Sair</a>
    </aside>
    <main class="painel-conteudo">
      <div class="painel-topo">
        <div>
          <h6 class="texto-suave">Atualize os seus dados de perfil</h6>
        </div>
        <div><span id="span_nome_usuario"></span> <span class="avatar" id="span_avatar"></span></div>
      </div>
      <div class="titulo-pagina">
        <div>
          <h1>Meu Perfil</h1>
          <p>Como o seu nome e a sua foto aparecem no nosso cantinho.</p>
        </div>
      </div>
      <div class="caixa caixa-estreita">
        <div class="perfil-cabecalho">
          <span class="avatar avatar-grande" id="span_avatar_grande" onclick="escolherFotoPerfil()" title="Clique para trocar sua foto">♡</span>
          <div>
            <h3 id="h3_nome"></h3>
            <br>
            <div class="linha-botoes linha-quebra">
              <button class="botao botao-pequeno" onclick="escolherFotoPerfil()">Trocar foto de perfil</button>
              <button class="botao botao-pequeno" id="botao_remover_foto" onclick="removerFotoPerfil()" hidden>✕ Remover foto</button>
            </div>
            <input type="file" id="input_foto" accept="image/jpeg,image/png,image/webp" onchange="enviarFotoPerfil()" hidden>
          </div>
        </div>
        <div class="campo">
          <label for="input_nome">Nome de exibição</label>
          <input id="input_nome" type="text">
        </div>
        <p id="p_mensagem" class="mensagem-formulario"></p>
        <div class="linha-botoes">
          <button class="botao botao-principal" onclick="salvarPerfil()">Salvar alterações</button>
          <a class="botao" href="dashboard.html">Voltar</a>
        </div>
      </div>
    </main>
  </div>
    <script src="js/geral.js"></script>
    <script src="js/perfil.js"></script>
</body>
</html>
